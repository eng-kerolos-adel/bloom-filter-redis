# بيشغل Redis Stack (فيه RedisBloom جاهز) + RedisInsight (واجهة رسومية على بورت 8001)
services:
  redis:
    image: redis/redis-stack:latest
    container_name: bloom-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # RedisInsight  ->  http://localhost:8001
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
